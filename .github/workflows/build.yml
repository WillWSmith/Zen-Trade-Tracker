name: Build Installer EXE

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pywebview yfinance pandas requests Pillow

    - name: Build EXE with PyInstaller, WebGUI, and Splash
      run: |
        pyinstaller --noconsole --onefile --icon=icon.ico --splash=splash.png --version-file=version_info.txt --add-data "icon.ico;." --add-data "gui;gui" trade_tracker.py

    - name: Install Inno Setup
      run: choco install innosetup

    - name: Compile Installer
      run: iscc setup.iss

    - name: Upload Installer as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zen-Trade-Tracker-Setup
        path: Output/Zen_Trade_Tracker_Installer.exe
